{% extends "base.html" %}
{% block content %}
<style>
  .login-bg {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
  }
</style>
<div class="flex items-center justify-center min-h-screen login-bg rounded-xl">
  <div class="bg-gray-800 bg-opacity-95 backdrop-blur p-10 rounded-xl shadow-2xl w-full max-w-md scale-in border-2 border-blue-500 hover:border-blue-400 hover:shadow-blue-500/50 transition-all">
    <h2 class="text-3xl font-bold mb-8 text-center fade-in">🔐 Login</h2>
    
    <form method="post" class="space-y-5">
      <div class="fade-in" style="animation-delay: 0.1s;">
        <label class="block text-sm font-semibold mb-2 text-blue-300">Username</label>
        <input name="username" placeholder="Enter username" class="w-full p-3 text-black rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
      </div>
      
      <div class="fade-in" style="animation-delay: 0.2s;">
        <label class="block text-sm font-semibold mb-2 text-blue-300">Password</label>
        <input name="password" type="password" placeholder="Enter password" class="w-full p-3 text-black rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
      </div>
      
      {% if error %}
        <div class="bg-red-600 p-3 rounded-lg text-sm scale-in">{{ error }}</div>
      {% endif %}
      
      <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 p-3 rounded-lg font-bold hover:from-blue-700 hover:to-blue-800 button-hover fade-in" style="animation-delay: 0.3s;" onclick="playSound('click')">Login</button>
    </form>
    
    <p class="text-center text-gray-400 mt-6 slide-in-right" style="animation-delay: 0.4s;">Don't have an account? <a href="/signup" class="text-blue-400 hover:text-blue-300 font-semibold" onclick="playSound('click')">Sign Up</a></p>
  </div>
</div>
{% endblock %}
