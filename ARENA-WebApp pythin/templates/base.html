<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARENA - Game Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes bounce-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.5); }
      50% { box-shadow: 0 0 30px rgba(102, 126, 234, 0.8); }
    }
    .fade-in { animation: fadeIn 0.5s ease-out; }
    .slide-in-right { animation: slideInRight 0.5s ease-out; }
    .slide-in-left { animation: slideInLeft 0.5s ease-out; }
    .scale-in { animation: scaleIn 0.4s ease-out; }
    .bounce-slow { animation: bounce-slow 2s ease-in-out infinite; }
    .glow-effect { animation: glow 3s ease-in-out infinite; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .button-hover { transition: all 0.3s ease; }
    .button-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
    
    /* Background styling */
    body {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      background-attachment: fixed;
      background-repeat: no-repeat;
      min-height: 100vh;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-gray-900 text-white relative">
  <!-- Navigation -->
  <nav class="gradient-bg shadow-lg sticky top-0 z-50 slide-in-left">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold bounce-slow">⚔️ ARENA</h1>
      <div class="flex gap-4 items-center">
        {% if current_user.is_authenticated %}
          <span class="text-sm fade-in">{{ current_user.username }} <span class="text-yellow-300 font-bold">({{ current_user.role }})</span></span>
          <a href="/logout" class="bg-red-600 px-3 py-1 rounded hover:bg-red-700 transition button-hover" onclick="playSound('click')">Logout</a>
        {% else %}
          <a href="/login" class="bg-blue-600 px-3 py-1 rounded hover:bg-blue-700 transition button-hover" onclick="playSound('click')">Login</a>
          <a href="/signup" class="bg-green-600 px-3 py-1 rounded hover:bg-green-700 transition button-hover" onclick="playSound('click')">Sign Up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Content -->
  <div class="min-h-screen py-12 px-4 relative z-10">
    <div class="flex justify-center">
      <div class="w-full max-w-7xl fade-in">
        {% if error %}
          <div class="bg-red-600 text-white p-4 rounded-lg mb-6 scale-in shadow-lg">
            <span class="font-bold">Error:</span> {{ error }}
          </div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <!-- Sound effects -->
  <script>
    function playSound(type) {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioContext.currentTime;
      
      if (type === 'click') {
        // Click sound
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'move') {
        // Game move sound
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'win') {
        // Win sound - ascending tones
        const notes = [523, 659, 784]; // C5, E5, G5
        notes.forEach((freq, i) => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.frequency.setValueAtTime(freq, now + i * 0.1);
          gain.gain.setValueAtTime(0.3, now + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
          osc.start(now + i * 0.1);
          osc.stop(now + i * 0.1 + 0.2);
        });
      }
    }

    // Add click sound to all buttons
    document.addEventListener('DOMContentLoaded', function() {
      const buttons = document.querySelectorAll('button, a[class*="bg-"]');
      buttons.forEach(btn => {
        if (!btn.hasAttribute('onclick')) {
          btn.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') {
              playSound('click');
            }
          });
        }
      });
    });
  </script>
</body>
</html>
